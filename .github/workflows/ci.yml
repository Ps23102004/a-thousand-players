name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Engine (node --test) and TS tests. No secrets are set: the suite must pass with no model keys.
      - run: npm test
      - run: npx tsc --noEmit -p .
